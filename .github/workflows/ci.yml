name: ci

on:
  push:
  pull_request:

jobs:
  core:
    # The tracker core depends only on Eigen + std, so it builds and tests in seconds on both
    # architectures without OpenCV or ONNX Runtime.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-14, name: macos-arm64 }
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev libgtest-dev
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install ninja eigen googletest
      - run: cmake --preset core
      - run: cmake --build --preset core
      - run: ctest --preset core

  sanitizers:
    name: core (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev libgtest-dev
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  docker:
    # Full app (OpenCV + ONNX Runtime) build and all tests, inside the shipping image.
    name: docker (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
